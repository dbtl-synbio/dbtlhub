<!--
  Styling for the parts of the page the theme does not provide: the logo in
  the banner, the navigation bar, and a few typographic adjustments. The
  theme's own stylesheet does everything else.
-->
<style>
  /*
    The logo file has a solid white background with no transparency
    anywhere in it. Drawn directly on the banner's gradient it would appear
    as a white rectangle with hard edges, so it is given a white panel with
    rounded corners, which reads as deliberate.
  */
  /*
    The banner places the logo, the words and the button in one row. The
    theme stacks them down the page, which gives a banner taller than the
    first screenful of text on a laptop.
  */
  .page-header {
    display: flex;
    align-items: center;
    gap: 2.2rem;
    padding: 2.6rem 6%;
    text-align: left;
  }
  .banner-text { flex: 1 1 14rem; }
  .page-header .project-name {
    font-size: 2.7rem;
    margin: 0;
  }
  .page-header .project-tagline {
    font-size: 1.18rem;
    font-weight: 400;
    margin: 0.15rem 0 0;
    opacity: 0.92;
  }
  .page-header .btn { flex: 0 0 auto; margin: 0; }

  /*
    The logo file has a solid white background with no transparency
    anywhere in it. Drawn directly on the banner's gradient it would appear
    as a white rectangle with hard edges, so it is given a white panel with
    rounded corners, which reads as deliberate.
  */
  .site-logo {
    flex: 0 0 auto;
    display: block;
    width: 176px;
    margin: 0;
    padding: 0.7rem 0.9rem;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  }

  .site-nav {
    background: #f4f6f8;
    border-bottom: 1px solid #dfe3e8;
  }
  .site-nav ul {
    max-width: 64rem;
    margin: 0 auto;
    padding: 0 6%;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.6rem;
  }
  .site-nav li { margin: 0; }
  .site-nav a {
    display: inline-block;
    padding: 0.85rem 0;
    color: #3c4650;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  .site-nav a:hover { color: #1f2933; border-bottom-color: #c3cbd3; }
  /* The page being read, marked so that a visitor knows where they are. */
  .site-nav a.here { color: #155799; border-bottom-color: #155799; }

  .page-title { margin-top: 1.6rem; }
  /* The sentence under a page title, which says what the page is for. */
  .standfirst {
    font-size: 1.12rem;
    line-height: 1.5;
    color: #4a545e;
    margin-top: -0.4rem;
  }

  /*
    The band at the foot of every page. It runs the full width of the

  */
  .site-footer {
    margin-top: 3.5rem;
    padding: 2rem 0 2.5rem;
    background: #f4f6f8;
    border-top: 1px solid #dfe3e8;

  }

    margin: 0 auto;
    padding: 0 6%;

  }

    max-width: 44rem;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  /*
    The logos. They are given the same height rather than the same width,

  .funder-logos {
    list-style: none;
    margin: 1.4rem 0 1.6rem;
    padding: 0;
