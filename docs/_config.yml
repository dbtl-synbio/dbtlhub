# The settings for the published site. GitHub Pages reads this file and
# builds https://dbtl-synbio.github.io/dbtlhub/ from the docs folder.
#
# The title and description are drawn into the banner at the top of every
# page by the layout in _layouts/default.html, so they are not repeated in
# the pages themselves.
title: DBTLHub
description: Interoperability contracts for the Design, Build, Test, Learn cycle

# The theme supplies the stylesheet. The arrangement of each page comes from
# _layouts/default.html, which this site provides itself, because the theme
# has no navigation and a site of several pages needs one.
theme: jekyll-theme-cayman

# Offered by the theme as a zip of the repository, which is not how anybody
# should obtain this.
show_downloads: false

repository_url: https://github.com/dbtl-synbio/dbtlhub

# The acknowledgement shown in the band at the foot of every page.
#
# PLACEHOLDER WORDING. It says that the work is supported rather than
# naming a funding instrument, because the exact sentence and any grant
# reference have not yet been supplied. Replace it with the wording the
# project is required to use.
acknowledgement: >-
  This work is supported by ELIXIR, the European research infrastructure
  for life science data.

# The logos shown beside the acknowledgement. Each needs an image file in
# this folder, a name for anybody who cannot see the image, and optionally
# an address to link to.
funders:
  - name: ELIXIR
    image: /elixir-logo.png
    url: https://elixir-europe.org/

# The navigation bar. Listed once here rather than written into every page,
# so that adding a page means adding one line.
nav:
  - name: Home
    url: /
  - name: The project
    url: /project.html
  - name: Interoperability contracts
    url: /contracts.html
  - name: Software
    url: /software.html
  - name: Use cases
    url: /use-cases.html
  - name: Get started
    url: /get-started.html
  - name: Acknowledgements
    url: /acknowledgements.html

# Nothing outside the docs folder is published. Without this, every README
# in the repository would be turned into a page of its own.
include: []
