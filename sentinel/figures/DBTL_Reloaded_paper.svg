"375.0" opacity="0.78">0</text><text x="654.0" y="388.0" opacity="0.90">0</text><text x="666.0" y="309.0" opacity="0.18">0</text><text x="666.0" y="322.0" opacity="0.36">0</text><text x="666.0" y="335.0" opacity="0.54">1</text><text x="666.0" y="348.0" opacity="0.72">0</text><text x="666.0" y="361.0" opacity="0.90">1</text></g><circle cx="590.0" cy="388.0" r="86" fill="none" stroke="#0e5c6b" stroke-width="2.8"/><rect x="516.0" y="338.0" width="148" height="116" rx="10" fill="#f7f9f8" opacity="0.92"/><text x="590.0" y="354.0" font-size="13" fill="#0e5c6b" text-anchor="middle">◉</text><text x="590.0" y="380.0" font-size="26" font-weight="700" fill="#0b3d46" text-anchor="middle">A</text><text x="590.0" y="400.0" font-size="12" font-weight="700" fill="#0e5c6b" text-anchor="middle">Architect</text><text x="590.0" y="418.0" font-size="8.5" fill="#5a6b66" text-anchor="middle">holds the one crate (KG)</text><text x="590.0" y="431.0" font-size="8.5" fill="#5a6b66" text-anchor="middle">which only ever grows</text><text x="590.0" y="447.0" font-size="8" fill="#5a6b66" text-anchor="middle">go on · go back · ask</text><rect x="42" y="166" width="216" height="94" rx="7" fill="#f7f9f8" stroke="#3a56a8" stroke-width="1.4"/><text x="58" y="186" font-size="11.5" font-weight="700" fill="#3a56a8">⌁ the researcher</text><text x="58" y="204" font-size="9" fill="#5a6b66">sets the objective and the first</text><text x="58" y="218" font-size="9" fill="#5a6b66">specification: target, equipment,</text><text x="58" y="232" font-size="9" fill="#5a6b66">budget. Approves, or decides.</text><line x1="258.0" y1="212.0" x2="506.2" y2="345.3" stroke="#3a56a8" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="506.2,345.3 494.0,344.4 498.7,335.6" fill="#3a56a8"/><line x1="506.2" y1="345.3" x2="258.0" y2="212.0" stroke="#3a56a8" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="258.0,212.0 270.3,213.0 265.6,221.7" fill="#3a56a8"/><text x="382" y="270" font-size="9" fill="#3a56a8" text-anchor="middle" transform="rotate(27 382 270)">they talk both ways</text><rect x="880" y="150" width="262" height="146" rx="7" fill="#f7f9f8" stroke="#d8e0db" stroke-width="1.2"/><text x="896" y="174" font-size="11.5" font-weight="700" fill="#0e5c6b">one sentinel, four contracts</text><text x="896" y="194" font-size="9" fill="#5a6b66">✸  The same agent stands at every handover</text><text x="896" y="208" font-size="9" fill="#5a6b66">and loads the contract for that one. The</text><text x="896" y="222" font-size="9" fill="#5a6b66">checks are the same; what they check</text><text x="896" y="236" font-size="9" fill="#5a6b66">against is not. It writes nothing of its</text><text x="896" y="250" font-size="9" fill="#5a6b66">own: it accepts, flags or refuses, and</text><text x="896" y="264" font-size="9" fill="#5a6b66">hands the crate on, richer by what it</text><text x="896" y="278" font-size="9" fill="#5a6b66">recorded about the check.</text><rect x="880" y="602" width="262" height="98" rx="7" fill="#f7f9f8" stroke="#d8e0db" stroke-width="1.2"/><text x="896" y="626" font-size="11.5" font-weight="700" fill="#0e5c6b">three verdicts</text><text x="898" y="648" font-size="10" fill="#0e5c6b">✓</text><text x="916" y="648" font-size="9.5" font-weight="700" fill="#0e5c6b">accepted</text><text x="984" y="648" font-size="9" fill="#5a6b66">the next phase starts</text><text x="898" y="665" font-size="10" fill="#b9761a">▲</text><text x="916" y="665" font-size="9.5" font-weight="700" fill="#b9761a">flagged</text><text x="984" y="665" font-size="9" fill="#5a6b66">it goes on, and is told</text><text x="898" y="682" font-size="10" fill="#a62b2b">✕</text><text x="916" y="682" font-size="9.5" font-weight="700" fill="#a62b2b">refused</text><text x="984" y="682" font-size="9" fill="#5a6b66">it does not travel</text><rect x="42" y="602" width="262" height="98" rx="7" fill="#f7f9f8" stroke="#d8e0db" stroke-width="1.2"/><text x="58" y="626" font-size="11.5" font-weight="700" fill="#0e5c6b">reading it</text><text x="58" y="646" font-size="9" fill="#5a6b66">⧉  a phase agent, which may be a person</text><text x="58" y="660" font-size="9" fill="#5a6b66">R1…Rn  one crate, a version per phase</text><text x="58" y="674" font-size="9" fill="#5a6b66">V  the verdict, which goes to A and</text><text x="58" y="688" font-size="9" fill="#5a6b66">     never straight to the next phase</text></svg>
