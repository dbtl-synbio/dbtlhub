# The workflow this whole format is modelled on.
#
# Drafted on 8 November 2026 from a worked bioprospecting cycle run in Anil
# Wipat's laboratory at Newcastle University, and confirmed as correct on
# 9 November 2026. The numbers are that cycle's real attrition.
#
# Two differences from `dbtlhub/bioprospecting/USE_CASE_STEPS.md`, both
# deliberate and both recorded here rather than silently applied:
#
#   * step 8 carries `handover_after: build_to_test`. The source file marks
#     three of the four handovers and not this one. Four phases have four
#     boundaries, so the omission is an omission.
#   * the `note:` fields naming contract checks are ours, not his. They say
#     which check in `framework/contracts/` a step feeds, which is the join
#     between a workflow and a contract and the reason this file exists.
---
name: bioprospecting
title: Find a useful enzyme in the environment and test it
use_case: bioprospecting
based_on: bioprospecting
source: >-
  dbtlhub/bioprospecting/USE_CASE_STEPS.md, drafted 8 November 2026 from a
  worked cycle in Anil Wipat's laboratory (Newcastle University) and confirmed
  9 November 2026.
description: |
  One turn of the cycle: search a metagenome for enzyme candidates, synthesise
  and express the ones worth making, assay them, and decide what to test next.
  The three counts are real - 96 candidates selected, 86 sequences returned by
  the vendor, 75 constructs passing PCR - and the gap between them is what a
  Build handover has to be able to explain.
steps:
  - number: 1
    name: Search metagenome for enzyme candidates
    phase: design
    note: >-
      The far end of the provenance chain. The metagenome came from a located
      field collection, and `broken_provenance_chain` walks back to it.

  - number: 2
    name: Filter on predicted structure and solubility
    phase: design

  - number: 3
    name: Select a diverse panel
    phase: design
    count_observed: 96
    note: >-
      96 candidates, chosen for maximum diversity. The reason each of the
      others was dropped is not currently recorded anywhere, which is a known
      gap in the Design handover.

  - number: 4
    name: Prepare DNA designs for synthesis
    phase: design
    handover_after: design_to_build
    handover_number: 1
    note: >-
      Where Handover 1 is checked. Thirteen checks, including that every order
      line binds to a crate entity and that the root declares its profile.

  - number: 5
    name: Synthesise DNA (vendor)
    phase: build
    count_observed: 86
    note: >-
      96 went out, 86 came back. The vendor's reply - which sequences were
      refused, which were codon-changed - does not travel with the handover
      today. Known gap.

  - number: 6
    name: Rehydrate and amplify DNA (PCR)
    phase: build
    manual_parts: [plate sealing, centrifugation]

  - number: 7
    name: Check PCR products
    phase: build
    count_observed: 75
    note: >-
      75 of 86 pass. The second unexplained drop.

  - number: 8
    name: Make protein (cell-free or fermentation)
    phase: build
    routes: [cell_free, fermentation]
    manual_parts: [moving plates between instruments]
    handover_after: build_to_test
    handover_number: 2
    note: >-
      The two routes differ by roughly a factor of 120 in time - under one day
      against about four months - and which one produced a given sample does
      not currently travel with it. The most consequential known gap.

  - number: 9
    name: Run enzyme reactions with substrates
    phase: test
    manual_parts: [plate sealing, moving plates between instruments]

  - number: 10
    name: Measure on plate reader
    phase: test

  - number: 11
    name: Call hits (statistics)
    phase: test
    handover_after: test_to_learn
    handover_number: 3
    note: >-
      The rule that separates a hit from a miss is not in the contract, so two
      labs can call different hits from identical readings and both pass.

  - number: 12
    name: Record results against each candidate
    phase: learn

  - number: 13
    name: Compare hits with sequence and structure
    phase: learn

  - number: 14
    name: Recommend what to test next
    phase: learn
    carried_out: false
    handover_after: learn_to_design
    handover_number: 4
    note: >-
      Not carried out in the worked cycle. The round was not closed, so this
      step is written from the contract rather than from the bench.
